name: Apply PDF Premium V2 Retry 5

on:
  push:
    paths:
      - ".github/workflows/apply_pdf_premium_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy PDF Premium V2
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/apply_pdf_premium_v2.sh -o /tmp/apply_pdf_premium_v2.sh
          chmod 700 /tmp/apply_pdf_premium_v2.sh
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes /tmp/apply_pdf_premium_v2.sh "$VPS_USER@$VPS_HOST:/tmp/apply_pdf_premium_v2.sh"
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/apply_pdf_premium_v2.sh; rc=$?; rm -f /tmp/apply_pdf_premium_v2.sh; exit $rc'

      - name: Fetch render-only test PDF
        if: success()
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST:/opt/matrix-scraper-v1/pdf_v2_test.pdf" ./pdf_v2_test.pdf

      - name: Upload test PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-premium-v2-test
          path: pdf_v2_test.pdf
          if-no-files-found: error
          retention-days: 3
