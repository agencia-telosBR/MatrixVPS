name: Inspect Sniper Live V3 Details
on:
  push:
    paths:
      - ".github/workflows/inspect_sniper_live_registration.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/inspect_sniper_live2.sh -o /tmp/i.sh
          chmod 700 /tmp/i.sh
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes /tmp/i.sh "$VPS_USER@$VPS_HOST:/tmp/i.sh"
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/i.sh; rc=$?; rm -f /tmp/i.sh; exit $rc'
