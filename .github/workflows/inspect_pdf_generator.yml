name: Inspect PDF Generator

on:
  push:
    paths:
      - ".github/workflows/inspect_pdf_generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect n8n PDF workflow
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== N8N WORKFLOWS ==="
            docker exec -u node sdr-n8n n8n export:workflow --all --output=/tmp/matrix_workflows.json >/tmp/n8n_export.log 2>&1 || { cat /tmp/n8n_export.log; exit 1; }
            docker cp sdr-n8n:/tmp/matrix_workflows.json /tmp/matrix_workflows.json >/dev/null
            python3 - <<'"'"'PY'"'"'
import json,re
p="/tmp/matrix_workflows.json"
data=json.load(open(p))
if isinstance(data,dict): data=[data]
print("count",len(data))
terms=re.compile(r"radar|competitivo|pdf|gotenberg|relat[oó]rio|report",re.I)
for w in data:
    s=json.dumps(w,ensure_ascii=False)
    if terms.search(s):
        print("--- WORKFLOW",w.get("id"),w.get("name"),"active=",w.get("active"))
        for n in w.get("nodes",[]):
            ns=json.dumps(n,ensure_ascii=False)
            if terms.search(ns):
                print("NODE",n.get("name"),n.get("type"))
                params=n.get("parameters",{})
                txt=json.dumps(params,ensure_ascii=False)
                print(txt[:3500])
PY
            rm -f /tmp/matrix_workflows.json
          '

# inspect n8n v4
