name: Inspect PDF Generator

on:
  push:
    paths:
      - ".github/workflows/inspect_pdf_generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect PDF generator
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== /OPT DIRECTORIES ==="
            find /opt -maxdepth 2 -type d | sort | sed -n "1,260p"
            echo "=== LIKELY GENERATOR FILES UNDER /OPT ==="
            find /opt -type f \( -iname "*.py" -o -iname "*.js" -o -iname "*.html" -o -iname "*.ts" -o -iname "*.json" \) -size -3M 2>/dev/null | while read f; do
              if grep -qiE "Radar Competitivo|Documento confidencial|Resumo executivo|Plano de melhoria|reportlab|weasyprint|puppeteer|playwright.*pdf|page\.pdf|canvas\.Canvas" "$f" 2>/dev/null; then
                echo "--- $f"
                grep -niE "Radar Competitivo|Documento confidencial|Resumo executivo|Plano de melhoria|reportlab|weasyprint|puppeteer|playwright.*pdf|page\.pdf|canvas\.Canvas" "$f" 2>/dev/null | head -30
              fi
            done
            echo "=== CONTAINERS ==="
            docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}"
            echo "=== MOUNTS ==="
            for c in $(docker ps --format "{{.Names}}"); do
              echo "--- $c"
              docker inspect "$c" --format "{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}" 2>/dev/null
            done
          '

# scan /opt v3
