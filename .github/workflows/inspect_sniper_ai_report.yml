name: Inspect Sniper AI And Report Bridge
on:
  push:
    paths:
      - ".github/workflows/inspect_sniper_ai_report.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          for f in inspect_sniper_v2_keyconfig.sh inspect_report_bridge_sniper.sh; do
            curl -fsSL "https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/$f" -o "/tmp/$f"
            chmod 700 "/tmp/$f"
            scp -i ~/.ssh/matrix_vps -o BatchMode=yes "/tmp/$f" "$VPS_USER@$VPS_HOST:/tmp/$f"
            ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" "bash /tmp/$f; rc=\$?; rm -f /tmp/$f; exit \$rc"
          done
