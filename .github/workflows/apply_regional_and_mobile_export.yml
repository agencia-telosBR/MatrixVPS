name: Apply Regional And Mobile Export Final

on:
  push:
    paths:
      - ".github/workflows/apply_regional_and_mobile_export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply changes
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/apply_regional_and_mobile_export.sh -o /tmp/apply.sh
          chmod 700 /tmp/apply.sh
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes /tmp/apply.sh "$VPS_USER@$VPS_HOST:/tmp/apply.sh"
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/apply.sh; rc=$?; rm -f /tmp/apply.sh; exit $rc'
