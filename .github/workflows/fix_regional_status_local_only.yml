name: Fix Regional Status Local Only

on:
  push:
    paths:
      - ".github/workflows/fix_regional_status_local_only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply status fix
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/fix_regional_status_local_only.sh -o /tmp/fix_regional_status_local_only.sh
          chmod 700 /tmp/fix_regional_status_local_only.sh
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes /tmp/fix_regional_status_local_only.sh "$VPS_USER@$VPS_HOST:/tmp/fix_regional_status_local_only.sh"
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/fix_regional_status_local_only.sh; rc=$?; rm -f /tmp/fix_regional_status_local_only.sh; exit $rc'
