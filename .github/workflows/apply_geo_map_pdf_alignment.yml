name: Apply GEO Map PDF Alignment

on:
  push:
    paths:
      - ".github/workflows/apply_geo_map_pdf_alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/matrix_vps
          chmod 600 ~/.ssh/matrix_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply GEO/PDF alignment
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/agencia-telosBR/MatrixVPS/main/ops/approved/apply_geo_map_pdf_alignment.sh -o /tmp/apply_geo_map_pdf_alignment.sh
          chmod 700 /tmp/apply_geo_map_pdf_alignment.sh
          scp -i ~/.ssh/matrix_vps -o BatchMode=yes /tmp/apply_geo_map_pdf_alignment.sh "$VPS_USER@$VPS_HOST:/tmp/apply_geo_map_pdf_alignment.sh"
          ssh -i ~/.ssh/matrix_vps -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash /tmp/apply_geo_map_pdf_alignment.sh; rc=$?; rm -f /tmp/apply_geo_map_pdf_alignment.sh; exit $rc'
